<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EI Report Generator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 48px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; color: #f8fafc; }
    .subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 32px; }
    .dropzone {
      border: 2px dashed #475569;
      border-radius: 12px;
      padding: 40px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: #0f172a;
    }
    .dropzone:hover, .dropzone.dragover { border-color: #3b82f6; background: #1e3a5f; }
    .dropzone-icon { font-size: 40px; margin-bottom: 12px; }
    .dropzone-text { color: #94a3b8; font-size: 14px; }
    .dropzone-text strong { color: #3b82f6; cursor: pointer; }
    .dropzone-hint { color: #64748b; font-size: 12px; margin-top: 8px; }
    .file-info {
      display: none;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px 16px;
      margin-top: 16px;
      font-size: 14px;
      align-items: center;
      gap: 10px;
    }
    .file-info.show { display: flex; }
    .file-info .name { flex: 1; color: #e2e8f0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-info .size { color: #64748b; font-size: 12px; }
    .file-info .remove { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 18px; padding: 0 4px; }
    .btn {
      width: 100%; padding: 14px; border: none; border-radius: 10px;
      font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 20px; transition: all 0.2s;
    }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-primary:hover:not(:disabled) { background: #2563eb; }
    .btn-primary:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
    .status {
      display: none; margin-top: 20px; padding: 14px 16px;
      border-radius: 10px; font-size: 14px; line-height: 1.5;
    }
    .status.show { display: block; }
    .status.loading { background: #1e3a5f; border: 1px solid #3b82f6; color: #93c5fd; }
    .status.success { background: #14532d; border: 1px solid #22c55e; color: #86efac; }
    .status.error { background: #450a0a; border: 1px solid #ef4444; color: #fca5a5; }
    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid #93c5fd; border-top-color: transparent;
      border-radius: 50%; animation: spin 0.6s linear infinite;
      vertical-align: middle; margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .docs-link {
      display: block; text-align: center; margin-top: 20px;
      color: #64748b; font-size: 13px; text-decoration: none;
    }
    .docs-link:hover { color: #3b82f6; }
    .job-id { font-family: monospace; color: #facc15; }
    .progress-bar {
      height: 4px; background: #334155; border-radius: 2px; margin-top: 10px; overflow: hidden;
    }
    .progress-bar .fill {
      height: 100%; background: #3b82f6; border-radius: 2px;
      animation: progress 2s ease-in-out infinite;
    }
    @keyframes progress {
      0% { width: 0%; }
      50% { width: 70%; }
      100% { width: 90%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>EI Report Generator</h1>
    <p class="subtitle">Upload E2E Task XLSX — get EI Summary report back</p>

    <div class="dropzone" id="dropzone">
      <div class="dropzone-icon">📄</div>
      <div class="dropzone-text">Drag & drop your <strong>.xlsx</strong> file here<br>or <strong id="browseBtn">browse</strong></div>
      <div class="dropzone-hint">Required sheets: Task_per_1k, Raw (optional)</div>
    </div>

    <input type="file" id="fileInput" accept=".xlsx" hidden>

    <div class="file-info" id="fileInfo">
      <span>📎</span>
      <span class="name" id="fileName"></span>
      <span class="size" id="fileSize"></span>
      <button class="remove" id="removeBtn" title="Remove">&times;</button>
    </div>

    <button class="btn btn-primary" id="submitBtn" disabled>Generate Report</button>

    <div class="status" id="status"></div>

    <a class="docs-link" href="https://ei-report-generator.onrender.com/docs" target="_blank">Swagger API Docs →</a>
  </div>

  <script>
    const API = "https://ei-report-generator.onrender.com";
    const dropzone = document.getElementById("dropzone");
    const fileInput = document.getElementById("fileInput");
    const browseBtn = document.getElementById("browseBtn");
    const fileInfo = document.getElementById("fileInfo");
    const fileName = document.getElementById("fileName");
    const fileSize = document.getElementById("fileSize");
    const removeBtn = document.getElementById("removeBtn");
    const submitBtn = document.getElementById("submitBtn");
    const status = document.getElementById("status");

    let selectedFile = null;

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + " B";
      if (bytes < 1048576) return (bytes / 1024).toFixed(1) + " KB";
      return (bytes / 1048576).toFixed(1) + " MB";
    }

    function selectFile(file) {
      if (!file || !file.name.endsWith(".xlsx")) {
        showStatus("error", "Only .xlsx files are accepted.");
        return;
      }
      selectedFile = file;
      fileName.textContent = file.name;
      fileSize.textContent = formatSize(file.size);
      fileInfo.classList.add("show");
      submitBtn.disabled = false;
      status.classList.remove("show");
    }

    function clearFile() {
      selectedFile = null;
      fileInput.value = "";
      fileInfo.classList.remove("show");
      submitBtn.disabled = true;
      status.classList.remove("show");
    }

    function showStatus(type, msg) {
      status.className = "status show " + type;
      status.innerHTML = msg;
    }

    // Drag & drop
    dropzone.addEventListener("dragover", (e) => { e.preventDefault(); dropzone.classList.add("dragover"); });
    dropzone.addEventListener("dragleave", () => dropzone.classList.remove("dragover"));
    dropzone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropzone.classList.remove("dragover");
      if (e.dataTransfer.files.length) selectFile(e.dataTransfer.files[0]);
    });

    // Click to browse
    dropzone.addEventListener("click", () => fileInput.click());
    browseBtn.addEventListener("click", (e) => { e.stopPropagation(); fileInput.click(); });
    fileInput.addEventListener("change", () => { if (fileInput.files.length) selectFile(fileInput.files[0]); });

    // Remove
    removeBtn.addEventListener("click", clearFile);

    async function wakeUp() {
      // Retry HEAD until service responds (handles spin-up from idle)
      for (let i = 0; i < 30; i++) {
        try {
          const r = await fetch(`${API}/health`, { method: "HEAD" });
          if (r.ok) return;
        } catch {}
        await new Promise(r => setTimeout(r, 3000));
      }
    }

    // Submit — async job flow
    submitBtn.addEventListener("click", async () => {
      if (!selectedFile) return;

      submitBtn.disabled = true;
      showStatus("loading", '<span class="spinner"></span>Uploading file...');

      const form = new FormData();
      form.append("file", selectedFile);

      try {
        // Step 0: Wake up service if idle
        showStatus("loading", '<span class="spinner"></span>Connecting to service...');
        await wakeUp();

        // Step 1: Submit job
        const submitRes = await fetch(`${API}/generate-report`, { method: "POST", body: form });

        if (!submitRes.ok) {
          let detail = "Unknown error";
          try { detail = (await submitRes.json()).detail; } catch {}
          showStatus("error", `Upload failed (${submitRes.status}): ${detail}`);
          submitBtn.disabled = false;
          return;
        }

        const { job_id } = await submitRes.json();
        showStatus("loading", `<span class="spinner"></span>Job <span class="job-id">${job_id}</span> processing...<div class="progress-bar"><div class="fill"></div></div>`);

        // Step 2: Poll for completion
        const result = await pollJob(job_id);

        if (result.status === "done") {
          showStatus("loading", '<span class="spinner"></span>Downloading report...');
          await downloadReport(job_id, result.output_filename);
          showStatus("success", `Report ready — download started.`);
        } else {
          showStatus("error", `Job failed: ${result.error || "Unknown error"}`);
        }
      } catch (err) {
        const msg = err.name === "AbortError"
          ? "Request timed out."
          : `Error: ${err.message}`;
        showStatus("error", msg);
      }

      submitBtn.disabled = false;
    });

    async function pollJob(jobId) {
      const maxAttempts = 200; // 200 × 5s = ~16 min max
      const interval = 5000;
      let consecutive502 = 0;

      for (let i = 0; i < maxAttempts; i++) {
        await new Promise(r => setTimeout(r, interval));

        let res;
        try {
          res = await fetch(`${API}/jobs/${jobId}`);
        } catch (e) {
          // Network error — service may be waking up
          consecutive502++;
          const elapsed = ((i + 1) * interval / 1000).toFixed(0);
          showStatus("loading", `<span class="spinner"></span>Waking up service... (${elapsed}s)<div class="progress-bar"><div class="fill"></div></div>`);
          continue;
        }

        // 502/503/504 = service waking up from idle, retry silently
        if (res.status === 502 || res.status === 503 || res.status === 504) {
          consecutive502++;
          const elapsed = ((i + 1) * interval / 1000).toFixed(0);
          showStatus("loading", `<span class="spinner"></span>Waking up service... (${elapsed}s)<div class="progress-bar"><div class="fill"></div></div>`);
          continue;
        }

        consecutive502 = 0;

        if (!res.ok) throw new Error(`Poll failed: ${res.status}`);

        const data = await res.json();
        if (data.status === "done" || data.status === "error") return data;

        // Update status with elapsed time
        const elapsed = ((i + 1) * interval / 1000).toFixed(0);
        showStatus("loading", `<span class="spinner"></span>Job <span class="job-id">${jobId}</span> processing... (${elapsed}s)<div class="progress-bar"><div class="fill"></div></div>`);
      }

      throw new Error("Timed out waiting for job to complete.");
    }

    async function downloadReport(jobId, filename) {
      const res = await fetch(`${API}/jobs/${jobId}/download`);
      if (!res.ok) throw new Error(`Download failed: ${res.status}`);

      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename || "EI_SUMMARY.xlsx";
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
